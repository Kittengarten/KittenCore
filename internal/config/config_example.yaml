nick_name: # 昵称，首个为默认昵称
  - 喵喵
  - 幼喵园
self_id: 1234567890 # Bot 账号
super_users: # 亲妈账号
  - 114514
  - 1919810
command_prefix: / # 指令前缀
add_space_after_at: true # 是否在 At 消息后没有空格时自动添加空格
set_force_base64_file: false # 是否强制使用 base64 发送文件
path: data/res/ # 资源文件路径
protocol: # 协议
  type: forward # 协议类型，forward/reverse/http
  url: ws://example.com:6700 # 链接
  access_token: Example # 密钥
  caller_url: # HTTP 调用链接
  caller_token: # HTTP 调用密钥
log: # 日志
  level: debug # 日志等级
  path: log/kitten.log # 日志路径
  crash: log/crash.log # 崩溃日志路径
  max_mb: 10 # 文件大小限制
  max_reserve: 0 # 最大保留日志文件数量，设置为 0 可以无限保留。
  expire: 0 # 日志文件的过期天数，大于该天数前的日志文件会被清理。设置为 0 可以禁用（日志不会过期）。
web_ui: # WebUI 配置
  enable: false # 是否启用 WebUI
  host: 127.0.0.1 # WebUI 主机
  port: 3000 # WebUI 端口
pprof: # pprof 配置
  enable: true # 是否启用 pprof
  host: 127.0.0.1 # pprof 主机
  port: 10086 # pprof 端口
